; CYPHIX production firmware v3 — dual Lead II + dedicated RLD.
;
; platform is PINNED on purpose. v2's ini said just `espressif32`, which means
; "whatever is installed the day you build": the same source would not have
; reproduced the same binary a year later, and that is why v2 had to be backed up
; as .bin files (see ../firmware_current/flashed_bin_v2_int32/RESTORE.md).
;
; No upload_port here, also on purpose. COM numbers are reassigned by Windows per
; device and per socket, and once already pointed a "never flash this" warning at
; the wrong board. Find the port by USB VID at flash time — FLASHING.md has the
; one-liner — and pass it with --upload-port.

[env:esp32doit-devkit-v1]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 256000

; v3.0.0 — pinned platform, no hard-coded port
