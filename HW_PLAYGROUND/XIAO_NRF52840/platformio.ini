; CYPHIX HW_PLAYGROUND - Seeed XIAO nRF52840 + ADS1293
;
; Port of ../firmware_playground (ESP32). The ESP project is untouched and
; still builds; this is a separate, self-contained environment.
;
; ---------------------------------------------------------------------------
; WHY NOT `platform = nordicnrf52`
; ---------------------------------------------------------------------------
; PlatformIO's official nordicnrf52 platform ships NO Seeed XIAO nRF52840 board
; definition - checked against nordicnrf52@11.0.0, and `pio boards xiao` only
; returns the SAMD21 and ESP32 XIAOs. Seeed never upstreamed the nRF52840
; variant (the D0..D10 pin map), so `board = xiaoble` fails with
; "UnknownBoard: Unknown board ID 'xiaoble'".
;
; maxgerhardt's community fork carries those four board defs:
;   xiaoble  xiaoble_adafruit  xiaoblesense  xiaoblesense_adafruit
; The `_adafruit` pair builds against the upstream Adafruit nRF52 core, which
; is the reference implementation of the Bluefruit API this firmware uses
; (configPrphBandwidth / BANDWIDTH_MAX / setWriteCallback).
;
; If you would rather not depend on a fork, the Arduino IDE route is official:
; Seeed's board package URL, board "Seeed XIAO nRF52840", and this same source
; tree. See FLASHING.md.
;
; ---------------------------------------------------------------------------
; BOARD
; ---------------------------------------------------------------------------
; xiaoble_adafruit        = Seeed XIAO nRF52840        <- default here
; xiaoblesense_adafruit   = Seeed XIAO nRF52840 Sense  <- swap if yours is Sense
; The two differ only in the on-board IMU/microphone, which this firmware never
; touches; pads 0..10 / 3V3 / GND / VUSB are identical on both.
;
; Upload: the Adafruit UF2 bootloader, not ESP-style serial flashing.
; DO NOT pin upload_port to a remembered COM number - identify the board by USB
; VID/PID first (Seeed = VID 2886). See FLASHING.md step 1.

[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200

; v0.1.0 - PlatformIO env for the XIAO nRF52840 playground build
