; CYPHIX HW_PLAYGROUND firmware — ESP32 + ADS1293, 3-channel Lead II experiment
;
; זהה לסביבת הקושחה הקיימת (esp32doit-devkit-v1).
; ⚠ upload_port לא נעול בכוונה: ה-ESP של הניסויים יקבל COM משלו.
;   מזהים אותו עם:  pio device list   (המכשיר הקיים יושב על COM7 — לא לגעת בו!)
;   ומצריבים עם:    pio run -t upload --upload-port COMx

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 256000

; v0.1.0 — PlatformIO env for the playground ESP (upload_port intentionally unset)
