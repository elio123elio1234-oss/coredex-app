<!doctype html>
<!-- The hero tablet's screen (v0.18.0): the CYPHIX recording view, drawn here so it is sharp, with the real wordmark.
     Leads I and II are modelled (inferior ST elevation, reciprocal in I); III, aVR, aVL and aVF are derived from them.
     The axis and the rate are computed from the trace. Build: see README.md in this folder. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Sora"; src: url("../../src/assets/fonts/sora-latin-var.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --ink: #1e293b;
    --ink-2: #475569;
    --ink-3: #8592a6;
    --line: #e3e9f1;
    --paper: #fbfcfe;
    --trace: #13213a;
    --st: #e0352b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1330px; height: 888px; background: #fff; }
  body { font-family: "Sora", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .screen { position: relative; width: 1330px; height: 888px; padding: 34px 38px 30px; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; height: 54px; }
  header svg.logo { height: 32px; width: auto; color: var(--ink); }
  .date { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 500; color: var(--ink); }
  .date svg { width: 16px; height: 16px; }
  .rule { height: 1px; background: var(--line); margin: 16px 0 20px; }
  .body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: 24px; min-height: 0; }
  .left { display: flex; flex-direction: column; min-height: 0; }
  .tools { display: flex; justify-content: flex-end; align-items: center; gap: 12px; height: 40px; margin-bottom: 12px; }
  .meta { margin-right: auto; font-size: 15.5px; color: var(--ink-2); }
  .chip { display: flex; align-items: center; gap: 14px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; font-size: 15.5px; font-weight: 500; color: var(--ink); background: #fff; }
  .chip svg { width: 14px; height: 14px; }
  .icon { width: 40px; padding: 0; justify-content: center; }
  .icon svg { width: 18px; height: 18px; }
  .paper { position: relative; flex: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); overflow: hidden; }
  .paper svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lead { position: absolute; left: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; background: #fff; }
  .label { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .axis .label { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .wheel { display: block; margin: 12px auto 4px; }
  .big { font-size: 52px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .big small { font-size: 19px; font-weight: 500; letter-spacing: 0; margin-left: 10px; color: var(--ink-2); }
  .sub { margin-top: 8px; font-size: 18px; font-weight: 600; }
  .fine { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
  .hr .big { margin-top: 12px; }
  .divider { height: 1px; background: var(--line); margin: 16px 0 14px; }
  .rhythm { margin-top: 8px; font-size: 24px; font-weight: 600; }
  .note { margin-top: auto; text-align: right; font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="screen">
  <header>
    <svg class="logo" viewBox="0 0 346 72" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M65.36 19.19 C60.25 7.51 49.44 0.68 34.81 0.68 C14.92 0.68 0.31 15.76 0.31 36.3 C0.31 56.84 14.92 71.92 34.81 71.92 C49.47 71.92 60.29 65.07 65.39 53.35 L58.74 50.81 C54.64 60.21 46.19 65.69 34.81 65.69 C19.51 65.69 7.470 52.74 7.47 36.3 C7.47 19.86 19.51 6.91 34.81 6.91 C46.09 6.91 54.5 12.31 58.63 21.57Z M67.26 1.88 L75.36 1.88 L97.81 37.25 L120.03 1.88 L128.09 1.88 L101.42 44.33 L101.42 70.72 L94.22 70.72 L94.22 44.34Z M132.75 27.44 L132.75 24.68 C132.75 10 141.97 1.28 157.5 1.28 C173.03 1.28 182.26 10 182.26 24.68 C182.26 36.78 172.74 45.54 159.57 45.54 L154.27 45.54 C145.7 45.54 139.96 51.05 139.96 59.27 L139.96 70.72 L132.6 70.72 L132.6 59.27 C132.6 47.14 141.15 39.24 154.27 39.24 L159.57 39.24 C168.22 39.24 174.9 32.89 174.9 24.68 C174.9 13.86 168.51 7.58 157.5 7.58 C146.49 7.58 140.11 13.86 140.11 24.68 L140.11 27.44Z M201.59 32.17 L201.59 1.88 L194.43 1.88 L194.43 70.72 L201.59 70.72 L201.59 38.44 L243.38 38.44 L243.38 70.72 L250.54 70.72 L250.54 1.88 L243.38 1.88 L243.38 32.17Z M267.67 1.88 L274.82 1.88 L274.82 70.72 L267.67 70.72Z M344.19 1.88 L335.66 1.88 L315.17 29.47 L294.7 1.88 L286.03 1.88 L310.83 35.31 L284.54 70.72 L293.08 70.72 L315.1 41.06 L337.09 70.72 L345.77 70.72 L319.44 35.22Z"/></svg>
    <div class="date">23 Sept 2026, 08:50 <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6 8 10.5 12.5 6"/></svg></div>
  </header>
  <div class="rule"></div>
  <div class="body">
    <div class="left">
      <div class="tools">
        <div class="meta">Limb leads · 10 s · 320 Hz</div>
        <div class="chip">12.5 mm/s <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6 8 10.5 12.5 6"/></svg></div>
        <div class="chip">10 mm/mV <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6 8 10.5 12.5 6"/></svg></div>
        <div class="chip icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg></div>
      </div>
      <div class="paper" id="paper"></div>
    </div>
    <div class="right">
      <div class="card axis">
        <div class="label">Frontal plane axis</div>
        <svg class="wheel" id="wheel" width="232" height="226" viewBox="-116 -113 232 226"></svg>
        <div class="big" id="deg"></div>
        <div class="sub">Normal axis</div>
        <div class="fine">Shaded sector: −30° to +90°</div>
      </div>
      <div class="card hr">
        <div class="label">Heart rate</div>
        <div class="big" id="bpm"></div>
        <div class="divider"></div>
        <div class="label">Rhythm</div>
        <div class="rhythm">Regular</div>
      </div>
      <div class="note">Illustrative recording.</div>
    </div>
  </div>
</div>
<script>
/* ---------- the recording: leads I and II modelled, the other four derived ---------- */
function rng(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const sig = (x) => 1 / (1 + Math.exp(-x));
// [amp mV, centre s from R, width before, width after]
const W = {
  I:  [[0.06, -0.165, 0.024, 0.024], [-0.03, -0.028, 0.009, 0.009], [0.58, 0, 0.011, 0.011], [-0.08, 0.026, 0.011, 0.011], [0.12, 0.27, 0.055, 0.04]],
  II: [[0.11, -0.165, 0.024, 0.024], [-0.05, -0.028, 0.009, 0.009], [0.98, 0, 0.011, 0.011], [-0.20, 0.026, 0.011, 0.011], [0.30, 0.27, 0.06, 0.042]],
};
// ST shift from the J point into the T wave (mV): inferior elevation, reciprocal in I
const ST = { I: -0.06, II: 0.30 };
const st = (dt) => sig((dt - 0.05) / 0.007) * (1 - sig((dt - 0.31) / 0.028));
const SECONDS = 10, FS = 250;
const RR = [0.80, 0.81, 0.79, 0.80, 0.82, 0.79, 0.80, 0.81, 0.80, 0.79, 0.80, 0.81, 0.80, 0.80];
const peaks = []; { let t = 0.42; for (const r of RR) { if (t > SECONDS + 0.5) break; peaks.push(t); t += r; } }
const rand = rng(320);
const n = SECONDS * FS + 1;
const noise = Array.from({ length: n }, () => (rand() - 0.5) * 0.012);
const I = [], II = [];
for (let k = 0; k < n; k++) {
  const t = k / FS;
  let a = 0.01 * Math.sin(2 * Math.PI * 0.18 * t + 0.4), b = 0.014 * Math.sin(2 * Math.PI * 0.18 * t + 0.9);
  for (const p of peaks) {
    const dt = t - p; if (dt < -0.4 || dt > 0.6) continue;
    for (const [lead, waves] of [["I", W.I], ["II", W.II]]) {
      let s = ST[lead] * st(dt);
      for (const [amp, at, w0, w1] of waves) { const w = dt < at ? w0 : w1; s += amp * Math.exp(-0.5 * ((dt - at) / w) ** 2); }
      if (lead === "I") a += s; else b += s;
    }
  }
  const m = (noise[k - 1] ?? 0) * 0.25 + noise[k] * 0.5 + (noise[k + 1] ?? 0) * 0.25;
  I.push(a + m * 0.8); II.push(b + m);
}
const LEADS = {
  I, II,
  III: II.map((v, k) => v - I[k]),
  aVR: II.map((v, k) => -(I[k] + v) / 2),
  aVL: II.map((v, k) => I[k] - v / 2),
  aVF: II.map((v, k) => v - I[k] / 2),
};
const ORDER = ["I", "II", "III", "aVR", "aVL", "aVF"];
const RED = new Set(["II", "III", "aVF"]);

/* ---------- paper at 12.5 mm/s, 10 mm/mV ---------- */
const paper = document.getElementById("paper");
const PW = paper.clientWidth, PH = paper.clientHeight;
const X0 = 82, X1 = PW - 14;                   // the trace runs X0..X1 for SECONDS
const MM = (X1 - X0) / (SECONDS * 12.5);         // px per mm
const PXMV = 10 * MM;
const ROW = PH / 6;
const ns = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(ns, "svg");
svg.setAttribute("viewBox", `0 0 ${PW} ${PH}`);
let grid = "";
for (let x = X0 % MM, i = 0; x < PW; x += MM, i++) grid += `<line x1="${x.toFixed(2)}" y1="0" x2="${x.toFixed(2)}" y2="${PH}" stroke="${Math.round((x - X0) / MM) % 5 === 0 ? "#dbe5f1" : "#eef3f9"}" stroke-width="${Math.round((x - X0) / MM) % 5 === 0 ? 1 : 0.6}"/>`;
for (let y = 0; y < PH; y += MM) grid += `<line x1="0" y1="${y.toFixed(2)}" x2="${PW}" y2="${y.toFixed(2)}" stroke="${Math.round(y / MM) % 5 === 0 ? "#dbe5f1" : "#eef3f9"}" stroke-width="${Math.round(y / MM) % 5 === 0 ? 1 : 0.6}"/>`;
let paths = "";
ORDER.forEach((name, row) => {
  const v = LEADS[name];
  const hi = Math.max(1, ...v), lo = Math.min(0, ...v);
  const base = row * ROW + ROW / 2 + ((hi + lo) / 2) * PXMV + 6;
  const y = (mv) => (base - mv * PXMV).toFixed(2);
  const step = (X1 - X0) / (v.length - 1);
  // calibration pulse: 1 mV for 0.2 s
  const p0 = 58, pw = 0.2 * 12.5 * MM;
  let d = `M51 ${y(0)}H${p0}V${y(1)}H${(p0 + pw).toFixed(2)}V${y(0)}H${X0}`;
  v.forEach((mv, k) => { d += `L${(X0 + k * step).toFixed(2)} ${y(mv)}`; });
  paths += `<path d="${d}" fill="none" stroke="#13213a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (RED.has(name)) {
    for (const p of peaks) {
      const k0 = Math.round((p + 0.045) * FS), k1 = Math.round((p + 0.27) * FS);
      if (k0 < 0 || k1 >= v.length) continue;
      let r = "";
      for (let k = k0; k <= k1; k++) r += `${k === k0 ? "M" : "L"}${(X0 + k * step).toFixed(2)} ${y(v[k])}`;
      paths += `<path d="${r}" fill="none" stroke="#e0352b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  }
  const lab = document.createElement("div");
  lab.className = "lead"; lab.textContent = name; lab.style.top = `${base - 10}px`;
  paper.appendChild(lab);
});
svg.innerHTML = grid + paths;
paper.prepend(svg);

/* ---------- the measurements the app shows: axis from the net QRS of I and aVF, rate from RR ---------- */
const qrs = (lead) => { let s = 0; for (const p of peaks) { const k0 = Math.round((p - 0.05) * FS), k1 = Math.round((p + 0.05) * FS); for (let k = Math.max(0, k0); k <= Math.min(n - 1, k1); k++) s += LEADS[lead][k]; } return s; };
const axis = Math.round((Math.atan2(qrs("aVF"), qrs("I")) * 180) / Math.PI);
document.getElementById("deg").textContent = `${axis}°`;
const bpm = Math.round(60 / (RR.slice(0, peaks.length - 1).reduce((a, b) => a + b, 0) / (peaks.length - 1)));
document.getElementById("bpm").innerHTML = `${bpm}<small>BPM</small>`;

const wheel = document.getElementById("wheel");
const R = 88, rad = (d) => (d * Math.PI) / 180;
const pt = (d, r) => [r * Math.cos(rad(d)), r * Math.sin(rad(d))];
let w = "";
const [sx, sy] = pt(-30, R), [ex, ey] = pt(90, R);
w += `<path d="M0 0L${sx.toFixed(2)} ${sy.toFixed(2)}A${R} ${R} 0 0 1 ${ex.toFixed(2)} ${ey.toFixed(2)}Z" fill="#e6ecf5"/>`;
w += `<circle r="${R}" fill="none" stroke="#cdd7e4" stroke-width="1.2"/><circle r="${R * 0.66}" fill="none" stroke="#e3e9f1"/><circle r="${R * 0.33}" fill="none" stroke="#e3e9f1"/>`;
for (let d = 0; d < 360; d += 30) { const [x, y] = pt(d, R); w += `<line x1="0" y1="0" x2="${x.toFixed(2)}" y2="${y.toFixed(2)}" stroke="#e3e9f1"/>`; }
for (const [lab, d] of [["I", 0], ["II", 60], ["aVF", 90], ["III", 120], ["aVR", -150], ["aVL", -30]]) {
  const [x, y] = pt(d, R + 17);
  w += `<text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle" font-family="Sora" font-size="13.5" font-weight="500" fill="#475569">${lab}</text>`;
}
const [ax, ay] = pt(axis, R * 0.92);
w += `<line x1="0" y1="0" x2="${ax.toFixed(2)}" y2="${ay.toFixed(2)}" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/><circle r="5.5" fill="#1e293b"/><circle cx="${ax.toFixed(2)}" cy="${ay.toFixed(2)}" r="5" fill="#1e293b"/>`;
wheel.innerHTML = w;
window.__ready = { axis, bpm, peaks: peaks.length, MM };
</script>
</body>
</html>
