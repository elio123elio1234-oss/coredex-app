; CYPHIX Band alpha - stage 2 bench firmware
; Seeed XIAO nRF52840  +  TI ADS1294 / ADS1296 / ADS1298 (one binary, the ID register decides)
;
; Platform and board are the pair the XIAO playground build already proved on
; this machine (HW_PLAYGROUND/XIAO_NRF52840/platformio.ini has the full story):
; PlatformIO's official nordicnrf52 platform has no Seeed XIAO nRF52840 board,
; maxgerhardt's fork does, and the `_adafruit` boards build on the Adafruit
; nRF52 core, whose Bluefruit library this firmware uses.
;
;   xiaoblesense_adafruit = XIAO nRF52840 Sense (USB PID 0x8045)  <- the unit on the desk
;   xiaoble_adafruit      = XIAO nRF52840 plain (USB PID 0x8044)
; Pads D0..D10 and the SPI pads are identical on both (checked in the variant
; files), so only the board line changes if the plain one is used.
;
; Upload is nrfutil DFU over the Adafruit bootloader. Do NOT pin upload_port to
; a remembered COM number: identify the board by USB VID/PID first
; (Seeed = VID 2886). See README.md.

[env:xiaoble]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
; Warnings for this project's own sources only (the framework is not ours to lint).
build_src_flags = -Wall -Wextra -Wno-unused-parameter

; v0.1.0 - PlatformIO env for the stage-2 ADS129x bench firmware (same platform + board as the XIAO playground build)
